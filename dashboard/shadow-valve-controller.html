<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Performance — 閥門控制器 車種對應表</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');

  :root {
    --orange: #EA5504;
    --orange-dim: #ea550433;
    --orange-glow: #ea550466;
    --bg: #0a0a0a;
    --bg2: #111111;
    --bg3: #1a1a1a;
    --card: #141414;
    --border: #222222;
    --text: #f0f0f0;
    --text2: #aaaaaa;
    --text3: #666666;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Top Bar ── */
  .top-bar {
    height: 4px;
    background: linear-gradient(90deg, var(--orange), #ff7b2e, var(--orange));
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
  }

  /* ── Nav ── */
  nav {
    position: fixed;
    top: 4px;
    left: 0;
    right: 0;
    z-index: 999;
    background: rgba(10, 10, 10, 0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
  }

  nav .logo { height: 28px; opacity: 0.9; }
  nav .nav-links { display: flex; gap: 24px; align-items: center; }
  nav .nav-links a {
    color: var(--text2);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.5px;
    transition: color 0.2s;
  }
  nav .nav-links a:hover { color: var(--orange); }

  /* ── Hero ── */
  .hero {
    margin-top: 64px;
    padding: 80px 24px 60px;
    position: relative;
    overflow: hidden;
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 50%, var(--bg) 100%);
  }

  .hero::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -20%;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, var(--orange-dim) 0%, transparent 70%);
    pointer-events: none;
  }

  .hero-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
  }

  .hero-text { position: relative; z-index: 1; }

  .hero-stripes {
    display: flex;
    gap: 6px;
    margin-bottom: 32px;
  }
  .hero-stripes span {
    width: 3px;
    height: 40px;
    background: var(--orange);
    transform: skewX(-15deg);
  }

  .hero h1 {
    font-size: 48px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 8px;
  }
  .hero h1 .accent { color: var(--orange); }

  .hero .subtitle {
    font-size: 14px;
    color: var(--text3);
    letter-spacing: 3px;
    font-weight: 500;
    margin-bottom: 32px;
    text-transform: uppercase;
  }

  .hero-stats {
    display: flex;
    gap: 32px;
  }
  .stat {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    min-width: 130px;
  }
  .stat .num {
    font-size: 36px;
    font-weight: 800;
    color: var(--orange);
    line-height: 1;
  }
  .stat .label {
    font-size: 12px;
    color: var(--text2);
    margin-top: 4px;
    font-weight: 500;
  }

  .hero-image {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .hero-image img {
    max-width: 100%;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .hero-image .glow {
    position: absolute;
    inset: -20px;
    background: radial-gradient(circle at center, var(--orange-dim), transparent 70%);
    border-radius: 50%;
    z-index: -1;
  }

  /* ── Toolbar ── */
  .toolbar {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 24px 0;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-box {
    flex: 1;
    min-width: 280px;
    position: relative;
  }
  .search-box input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px 12px 44px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-box input:focus { border-color: var(--orange); }
  .search-box input::placeholder { color: var(--text3); }
  .search-box svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
  }

  .filter-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    color: var(--text2);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  .filter-btn:hover { border-color: var(--orange); color: var(--text); }
  .filter-btn.active {
    background: var(--orange);
    color: white;
    border-color: var(--orange);
  }

  .result-count {
    font-size: 13px;
    color: var(--text3);
    margin-left: auto;
  }

  /* ── Brand Sections ── */
  .brands-container {
    max-width: 1200px;
    margin: 32px auto;
    padding: 0 24px;
  }

  .brand-section {
    margin-bottom: 8px;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: var(--card);
    transition: border-color 0.2s;
  }
  .brand-section:hover { border-color: #333; }

  .brand-header {
    display: flex;
    align-items: center;
    padding: 16px 20px;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .brand-header:hover { background: var(--bg3); }

  .brand-indicator {
    width: 4px;
    height: 28px;
    background: var(--orange);
    border-radius: 2px;
    margin-right: 16px;
    flex-shrink: 0;
  }

  .brand-name {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.5px;
    flex: 1;
  }

  .brand-count {
    background: var(--orange-dim);
    color: var(--orange);
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    margin-right: 12px;
  }

  .brand-arrow {
    color: var(--text3);
    transition: transform 0.3s;
    flex-shrink: 0;
  }
  .brand-section.open .brand-arrow { transform: rotate(180deg); }

  .brand-cars {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
  }
  .brand-section.open .brand-cars {
    max-height: 99999px;
  }

  .brand-cars-inner {
    padding: 0 20px 16px;
    border-top: 1px solid var(--border);
  }

  /* ── Car Card ── */
  .car-card {
    padding: 16px 0;
    border-bottom: 1px solid #1a1a1a;
  }
  .car-card:last-child { border-bottom: none; }

  .car-top {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }

  .car-name {
    font-size: 15px;
    font-weight: 600;
  }
  .car-chassis {
    font-size: 13px;
    color: var(--text2);
  }
  .car-year {
    font-size: 12px;
    color: var(--text3);
    margin-left: 4px;
  }

  .ctrl-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.8px;
    padding: 3px 10px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .ctrl-tag.xflap {
    background: #1a2a1a;
    color: #4ade80;
    border: 1px solid #2a4a2a;
  }
  .ctrl-tag.evalve {
    background: #1a1a2a;
    color: #60a5fa;
    border: 1px solid #2a2a4a;
  }

  .car-details {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 6px 24px;
  }

  .detail-row {
    display: flex;
    font-size: 12px;
    line-height: 1.8;
  }
  .detail-label {
    color: var(--text3);
    white-space: nowrap;
    min-width: 52px;
  }
  .detail-value {
    color: var(--text2);
    word-break: break-all;
  }

  /* ── Footer ── */
  footer {
    max-width: 1200px;
    margin: 60px auto 0;
    padding: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--text3);
    font-size: 12px;
  }
  footer a { color: var(--orange); text-decoration: none; }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .hero-inner { grid-template-columns: 1fr; gap: 32px; }
    .hero h1 { font-size: 32px; }
    .hero-stats { flex-wrap: wrap; gap: 12px; }
    .stat { min-width: 100px; padding: 14px 16px; }
    .stat .num { font-size: 28px; }
    .hero-image { display: none; }
    nav .nav-links { display: none; }
    .car-details { grid-template-columns: 1fr; }
  }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .brand-section { animation: fadeUp 0.3s ease forwards; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--orange); }
</style>
</head>

let currentFilter = 'all';
let searchText = '';

function escHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderCtrlTags(ctrl) {
  if (!ctrl) return '';
  return ctrl.split('|').map(c => {
    c = c.trim();
    const cls = c === 'X-FLAP' ? 'xflap' : 'evalve';
    return `<span class="ctrl-tag ${cls}">${escHtml(c)}</span>`;
  }).join(' ');
}

function renderCar(car) {
  const chassis = car.chassis ? ` <span class="car-chassis">(${escHtml(car.chassis)})</span>` : '';
  const year = car.year ? `<span class="car-year">${escHtml(car.year)}</span>` : '';

  let details = [];
  if (car.valve_type || car.valve_count) {
    const parts = [car.valve_type, car.valve_count].filter(Boolean).join(' / ');
    details.push(['閥門', parts]);
  }
  if (car.pin) details.push(['接頭', car.pin]);
  if (car.xflap_ver) details.push(['X-FLAP', car.xflap_ver]);
  if (car.evalve2_main) details.push(['主機', car.evalve2_main]);
  if (car.evalve2_harness) details.push(['線組', car.evalve2_harness]);
  if (car.evalve2_shield && car.evalve2_shield !== 'no need') details.push(['屏蔽', car.evalve2_shield]);
  if (car.motor_pn) details.push(['料號', car.motor_pn]);

  const detailsHtml = details.map(([lbl, val]) =>
    `<div class="detail-row"><span class="detail-label">${lbl}</span><span class="detail-value">${escHtml(val)}</span></div>`
  ).join('');

  return `<div class="car-card">
    <div class="car-top">
      <span class="car-name">${escHtml(car.model)}${chassis} ${year}</span>
      ${renderCtrlTags(car.controller)}
    </div>
    <div class="car-details">${detailsHtml}</div>
  </div>`;
}

function render() {
  const container = document.getElementById('brandsContainer');
  const q = searchText.toLowerCase();
  let totalVisible = 0;
  let html = '';

  for (const [brand, cars] of Object.entries(DATA)) {
    const filtered = cars.filter(car => {
      // Filter by controller
      if (currentFilter !== 'all' && !car.controller.includes(currentFilter)) return false;
      // Search
      if (q) {
        const haystack = [brand, car.model, car.chassis, car.year, car.controller, car.valve_type, car.pin, car.motor_pn].join(' ').toLowerCase();
        return haystack.includes(q);
      }
      return true;
    });

    if (filtered.length === 0) continue;
    totalVisible += filtered.length;

    const isOpen = q ? 'open' : '';
    html += `<div class="brand-section ${isOpen}">
      <div class="brand-header" onclick="this.parentElement.classList.toggle('open')">
        <div class="brand-indicator"></div>
        <span class="brand-name">${escHtml(brand)}</span>
        <span class="brand-count">${filtered.length} 台</span>
        <svg class="brand-arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="brand-cars">
        <div class="brand-cars-inner">
          ${filtered.map(renderCar).join('')}
        </div>
      </div>
    </div>`;
  }

  container.innerHTML = html || '<div style="text-align:center;padding:60px;color:var(--text3)">無符合條件的車種</div>';
  document.getElementById('resultCount').textContent = `${totalVisible} 台車種`;
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === f);
  });
  render();
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchText = e.target.value.trim();
  render();
});

// Initial render
render();
</script>
